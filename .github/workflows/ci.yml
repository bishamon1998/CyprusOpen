name: Build and integration checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [statistics-service, parking-service, pharmacies-service]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run HTTP integration checks
        run: sh mvnw -B -ntp -pl backend/${{ matrix.service }} -am verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  end-to-end:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: unused-ci-admin
      STATISTICS_DB_PASSWORD: unused-ci-statistics
      PARKING_DB_PASSWORD: unused-ci-parking
      PHARMACIES_DB_PASSWORD: unused-ci-pharmacies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build frontend statistics-service parking-service pharmacies-service
      - name: Wait for services
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000/api/v1/statistics/datasets && curl -fsS http://localhost:3000/api/v1/parking | jq -e '.items | length > 0' && curl -fsS http://localhost:3000/api/v1/pharmacies | jq -e '.items | length == 5'; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: pnpm test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down
