# Every scheduled import from an official source, in one place.
#
# Each service runs only the jobs it implements; the other entries are ignored there.
# A job also runs once right after start-up when its stored data is missing or stale.
# Jobs are disabled unless their environment variable is true (external fetching is off by default).
# Environment variables or service properties may override any value here.
#
# Cron fields: second minute hour day-of-month month day-of-week, in the zone below.
cyprusopen.refresh.zone=Asia/Nicosia

# parking-service: CYNAP parking directory (DATEX II XML). The source changes less than yearly.
# Monthly, 1st day at 05:00.
cyprusopen.refresh.jobs.parking-directory.cron=0 0 5 1 * *
cyprusopen.refresh.jobs.parking-directory.enabled=${PARKING_DIRECTORY_SYNC_ENABLED:false}

# pharmacies-service: duty pharmacy rosters (data.gov.cy CSV per district). New files appear irregularly.
# Daily at 06:15, before the roster day changes at 08:00. Start-up run when the last check is older than a day.
cyprusopen.refresh.jobs.pharmacy-schedule.cron=0 15 6 * * *
cyprusopen.refresh.jobs.pharmacy-schedule.enabled=${PHARMACY_SYNC_ENABLED:false}

# statistics-service: CYSTAT tables (JSON-stat). Published monthly or annually; only newer releases are stored.
# Weekly, Monday at 04:30.
cyprusopen.refresh.jobs.statistics.cron=0 30 4 * * MON
cyprusopen.refresh.jobs.statistics.enabled=${STATISTICS_SYNC_ENABLED:false}

# parking-service: current air quality by station (Department of Labour Inspection JSON). The source updates hourly.
# Every hour at minute 20. Start-up run when the last import is older than 50 minutes.
cyprusopen.refresh.jobs.air-quality.cron=0 20 * * * *
cyprusopen.refresh.jobs.air-quality.enabled=${AIR_QUALITY_SYNC_ENABLED:false}
