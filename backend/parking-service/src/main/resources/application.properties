spring.application.name=parking-service
server.address=0.0.0.0
server.port=${PORT:8082}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.datasource.url=${PARKING_JDBC_URL:jdbc:postgresql://localhost:5432/parking?currentSchema=parking}
spring.datasource.username=${PARKING_DB_USER:parking_app}
spring.datasource.password=${PARKING_DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${PARKING_DB_SCHEMA:parking}
parking.directory.sync-enabled=${PARKING_DIRECTORY_SYNC_ENABLED:false}
parking.directory.resource-url=${PARKING_DIRECTORY_RESOURCE_URL:https://fixcyprus.cy/gnosis/open/api/nap/datasets/parking_areas/}
