spring.application.name=pharmacies-service
server.address=0.0.0.0
server.port=${PORT:8083}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.datasource.url=${PHARMACIES_JDBC_URL:jdbc:postgresql://localhost:5432/pharmacies?currentSchema=pharmacies}
spring.datasource.username=${PHARMACIES_DB_USER:pharmacies_app}
spring.datasource.password=${PHARMACIES_DB_PASSWORD:}
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${PHARMACIES_DB_SCHEMA:pharmacies}
pharmacies.catalog-metadata-url=${PHARMACY_CATALOG_METADATA_URL:https://www.data.gov.cy/el/dataset/817/dcat-ap-2.0/json}
