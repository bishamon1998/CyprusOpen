spring.application.name=pharmacies-service
server.address=0.0.0.0
server.port=${PORT:8083}
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
pharmacies.schedules.directory=${PHARMACY_SCHEDULE_DIRECTORY:}
pharmacies.sync-enabled=${PHARMACY_SYNC_ENABLED:false}
pharmacies.snapshot-file=${PHARMACY_SNAPSHOT_FILE:pharmacy-schedules.json}
pharmacies.locations-file=${PHARMACY_LOCATIONS_FILE:}
