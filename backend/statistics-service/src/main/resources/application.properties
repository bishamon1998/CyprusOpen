spring.application.name=statistics-service
server.address=0.0.0.0
server.port=${PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.datasource.url=${STATISTICS_JDBC_URL:jdbc:postgresql://localhost:5432/statistics?currentSchema=statistics}
spring.datasource.username=${STATISTICS_DB_USER:statistics_app}
spring.datasource.password=${STATISTICS_DB_PASSWORD:}
# Low traffic: a few request threads and one idle database connection keep the JVM and Postgres small.
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=1
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${STATISTICS_DB_SCHEMA:statistics}
statistics.cystat-api-url=${STATISTICS_CYSTAT_API_URL:https://cystatdb.cystat.gov.cy/api/v1/en/8.CYSTAT-DB/}
# CYSTAT answers 429 to bursts; tables are fetched this far apart.
statistics.cystat-request-interval=${STATISTICS_CYSTAT_REQUEST_INTERVAL:3s}
