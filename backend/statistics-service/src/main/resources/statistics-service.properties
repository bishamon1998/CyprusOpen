statistics.datasource.url=${STATISTICS_JDBC_URL:jdbc:postgresql://localhost:5432/statistics?currentSchema=statistics}
statistics.datasource.username=${STATISTICS_DB_USER:statistics_app}
statistics.datasource.password=${STATISTICS_DB_PASSWORD:}
statistics.datasource.schema=${STATISTICS_DB_SCHEMA:statistics}
statistics.cystat-api-url=${STATISTICS_CYSTAT_API_URL:https://cystatdb.cystat.gov.cy/api/v1/en/8.CYSTAT-DB/}
# CYSTAT answers 429 to bursts; tables are fetched this far apart.
statistics.cystat-request-interval=${STATISTICS_CYSTAT_REQUEST_INTERVAL:3s}
