services:
  postgres:
    ports: !override []
  frontend:
    ports: !override ["127.0.0.1:${TEST_FRONTEND_PORT:-3000}:3000"]
  parking-fixture:
    image: node:24-alpine
    volumes:
      - ./scripts/fixtures:/fixtures:ro
    command: ["node", "/fixtures/parking-server.mjs"]
  parking-service:
    environment:
      PARKING_DIRECTORY_SYNC_ENABLED: "true"
      PARKING_DIRECTORY_RESOURCE_URL: http://parking-fixture:9090/directory
      AIR_QUALITY_SYNC_ENABLED: "true"
      AIR_QUALITY_RESOURCE_URL: http://parking-fixture:9090/air
      BEACHES_SYNC_ENABLED: "true"
      BEACHES_DISCODATA_URL: http://parking-fixture:9090/sql
    depends_on:
      parking-fixture:
        condition: service_started
  statistics-fixture:
    image: node:24-alpine
    volumes:
      - ./scripts/fixtures/statistics-server.mjs:/fixtures/statistics-server.mjs:ro
      - ./backend/statistics-service/src/test/resources/cystat:/cystat:ro
    command: ["node", "/fixtures/statistics-server.mjs"]
  statistics-service:
    environment:
      STATISTICS_SYNC_ENABLED: "true"
      STATISTICS_CYSTAT_API_URL: http://statistics-fixture:9091/api/
      STATISTICS_CYSTAT_REQUEST_INTERVAL: 0s
    depends_on:
      statistics-fixture:
        condition: service_started
  pharmacy-fixture:
    image: node:24-alpine
    volumes:
      - ./scripts/fixtures:/fixtures:ro
    command: ["node", "/fixtures/pharmacy-server.mjs"]
  pharmacies-service:
    environment:
      PHARMACY_SYNC_ENABLED: "true"
      PHARMACY_CATALOG_METADATA_URL: http://pharmacy-fixture:9091/metadata
    depends_on:
      pharmacy-fixture:
        condition: service_started
