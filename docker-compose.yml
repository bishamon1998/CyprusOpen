name: cyprus-open

services:
  # Statistics, places (parking, beaches, air quality) and pharmacies in one process, each with its own database.
  backend:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    environment:
      PORT: 8080
      STATISTICS_JDBC_URL: jdbc:postgresql://postgres:5432/statistics?currentSchema=statistics
      STATISTICS_DB_USER: statistics_app
      STATISTICS_DB_PASSWORD: ${STATISTICS_DB_PASSWORD:?Set STATISTICS_DB_PASSWORD in .env}
      STATISTICS_SYNC_ENABLED: ${STATISTICS_SYNC_ENABLED:-false}
      PARKING_JDBC_URL: jdbc:postgresql://postgres:5432/parking?currentSchema=parking
      PARKING_DB_USER: parking_app
      PARKING_DB_PASSWORD: ${PARKING_DB_PASSWORD:?Set PARKING_DB_PASSWORD in .env}
      PARKING_DIRECTORY_SYNC_ENABLED: ${PARKING_DIRECTORY_SYNC_ENABLED:-false}
      AIR_QUALITY_SYNC_ENABLED: ${AIR_QUALITY_SYNC_ENABLED:-false}
      BEACHES_SYNC_ENABLED: ${BEACHES_SYNC_ENABLED:-false}
      PHARMACIES_JDBC_URL: jdbc:postgresql://postgres:5432/pharmacies?currentSchema=pharmacies
      PHARMACIES_DB_USER: pharmacies_app
      PHARMACIES_DB_PASSWORD: ${PHARMACIES_DB_PASSWORD:?Set PHARMACIES_DB_PASSWORD in .env}
      PHARMACY_SYNC_ENABLED: ${PHARMACY_SYNC_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: 3000
      STATISTICS_UPSTREAM: http://backend:8080
      PARKING_UPSTREAM: http://backend:8080
      PHARMACIES_UPSTREAM: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      STATISTICS_DB_PASSWORD: ${STATISTICS_DB_PASSWORD:?Set STATISTICS_DB_PASSWORD in .env}
      PARKING_DB_PASSWORD: ${PARKING_DB_PASSWORD:?Set PARKING_DB_PASSWORD in .env}
      PHARMACIES_DB_PASSWORD: ${PHARMACIES_DB_PASSWORD:?Set PHARMACIES_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/001-databases.sql:/docker-entrypoint-initdb.d/001-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
