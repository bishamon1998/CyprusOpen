<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Cyprus Open — interface draft</title>
  <link rel="stylesheet" href="styles.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <a class="skip" href="#content" data-text="skip"></a>
  <aside class="preview" aria-label="Prototype controls">
    <div class="wrap preview-inner">
      <span data-text="draft"></span>
      <label><span data-text="previewState"></span>
        <select id="state">
          <option value="draft" data-text="layout"></option>
          <option value="loading" data-text="loading"></option>
          <option value="empty" data-text="empty"></option>
          <option value="error" data-text="error"></option>
          <option value="stale" data-text="stale"></option>
        </select>
      </label>
    </div>
  </aside>
  <header class="wrap">
    <div class="masthead">
      <a class="brand" href="#statistics" aria-label="Cyprus Open">Cyprus<span>Open</span><span class="brand-dot" aria-hidden="true"></span></a>
      <div class="languages" role="group" id="languages" aria-label="Language">
        <button type="button" data-language="en" aria-pressed="true">EN</button>
        <button type="button" data-language="ru" aria-pressed="false">RU</button>
        <button type="button" data-language="el" aria-pressed="false">EL</button>
      </div>
    </div>
    <nav id="navigation" aria-label="Main navigation">
      <a href="#statistics" data-page="statistics" data-text="statistics" aria-current="page"></a>
      <a href="#parking" data-page="parking" data-text="parking"></a>
      <a href="#pharmacies" data-page="pharmacies" data-text="pharmacies"></a>
      <a href="#about" data-page="about" data-text="about"></a>
    </nav>
  </header>
  <main id="content" class="wrap">
    <section id="statistics" class="page" aria-labelledby="statistics-title">
      <div class="intro">
        <p class="eyebrow" data-text="publicData"></p>
        <h1 id="statistics-title" data-text="statisticsTitle"></h1>
        <p class="lead" data-text="statisticsIntro"></p>
      </div>
      <article class="dataset" aria-labelledby="immigration-title">
        <div class="section-heading"><span class="index" aria-hidden="true">01</span><div><p class="eyebrow" data-text="migration"></p><h2 id="immigration-title" data-text="immigrationTitle"></h2></div></div>
        <p class="description" data-text="immigrationDescription"></p>
        <div class="filters"><label><span data-text="year"></span><select disabled><option data-text="awaitingMetadata"></option></select></label><span class="unit" data-text="immigrationUnit"></span></div>
        <div class="data-region" data-kind="immigration" aria-live="polite"></div>
        <p class="source" data-text="immigrationSource"></p>
      </article>
      <article class="dataset" aria-labelledby="tourism-title">
        <div class="section-heading"><span class="index" aria-hidden="true">02</span><div><p class="eyebrow" data-text="tourism"></p><h2 id="tourism-title" data-text="tourismTitle"></h2></div></div>
        <p class="description" data-text="tourismDescription"></p>
        <div class="filters"><label><span data-text="year"></span><select disabled><option data-text="awaitingMetadata"></option></select></label><label><span data-text="season"></span><select disabled><option data-text="awaitingMetadata"></option></select></label></div>
        <div class="data-region" data-kind="tourism" aria-live="polite"></div>
        <p class="source" data-text="tourismSource"></p>
      </article>
    </section>
    <section id="parking" class="page" aria-labelledby="parking-title" hidden>
      <div class="intro"><p class="eyebrow" data-text="aroundYou"></p><h1 id="parking-title" data-text="parkingTitle"></h1><p class="lead" data-text="parkingIntro"></p></div>
      <div class="parking-controls"><div role="group" id="parking-view" aria-label="Parking view"><button type="button" data-view="list" aria-pressed="true" data-text="list"></button><button type="button" data-view="map" aria-pressed="false" data-text="map"></button></div><p class="notice" id="parking-status" aria-live="polite"></p></div>
      <div id="parking-list"><div class="parking-row"><span class="placeholder-pin" aria-hidden="true">P</span><div><h2 data-text="parkingPlaceholder"></h2><p data-text="parkingDetails"></p></div><span class="unknown" data-text="unknown"></span></div><div class="parking-row"><span class="placeholder-pin" aria-hidden="true">P</span><div><h2 data-text="parkingPlaceholder"></h2><p data-text="parkingDetails"></p></div><span class="unknown" data-text="unknown"></span></div></div>
      <div class="map-placeholder" id="parking-map" hidden><div><p class="eyebrow" data-text="mapArea"></p><h2 data-text="mapPending"></h2><p data-text="noCoordinates"></p></div></div>
      <p class="source" data-text="parkingSource"></p>
    </section>
    <section id="pharmacies" class="page" aria-labelledby="pharmacies-title" hidden><div class="intro"><p class="eyebrow" data-text="comingSoon"></p><h1 id="pharmacies-title" data-text="pharmacies"></h1><p class="lead" data-text="pharmaciesIntro"></p></div><p class="notice" data-text="pharmaciesPending"></p></section>
    <section id="about" class="page" aria-labelledby="about-title" hidden><div class="intro"><p class="eyebrow" data-text="transparency"></p><h1 id="about-title" data-text="aboutTitle"></h1><p class="lead" data-text="aboutIntro"></p></div><dl class="source-details"><div><dt data-text="publisher"></dt><dd><a href="https://www.data.gov.cy/" target="_blank" rel="noopener">Cyprus Government Open Data Portal</a> · <a href="https://www.cystat.gov.cy/" target="_blank" rel="noopener">CYSTAT</a></dd></div><div><dt data-text="definitions"></dt><dd data-text="definitionsValue"></dd></div><div><dt data-text="license"></dt><dd data-text="licensePending"></dd></div><div><dt data-text="lastSync"></dt><dd data-text="notSynced"></dd></div><div><dt data-text="scope"></dt><dd data-text="scopeValue"></dd></div></dl></section>
  </main>
  <footer class="wrap"><span>Cyprus Open</span><span data-text="footer"></span></footer>
</body>
</html>
